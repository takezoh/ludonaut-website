<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludonaut</title>
<meta name="description" content="A platform for AI that sees and plays games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#050506}
::selection{background:#FF2B5E;color:#050506}
@keyframes ln-scan{0%{top:-18%}100%{top:118%}}
.ln-scan--on{animation:ln-scan 9s linear infinite}
@media (prefers-reduced-motion: reduce){.ln-scan--on{animation:none}}
</style>
</head>
<body>
<main style="position: relative; width: 100%; min-height: 100vh; box-sizing: border-box; padding: clamp(32px, 5vw, 72px); display: grid; align-items: end; justify-items: start; overflow: hidden; background: #050506; color: #F2F2F0; font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; display: block; background-image: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, rgba(255, 255, 255, 0) 1px, rgba(255, 255, 255, 0) 3px)"></div>
<svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: 0.07; pointer-events: none; display: block"><filter id="ln-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#ln-grain)"></rect></svg>
<div aria-hidden="true" class="ln-scan ln-scan--on" style="position: absolute; left: 0; right: 0; top: -18%; height: 16%; z-index: 0; pointer-events: none; display: block; background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.035) 50%, rgba(255, 255, 255, 0) 100%)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(5, 5, 6, 0) 40%, rgba(0, 0, 0, 0.72) 100%)"></div>
<span aria-hidden="true" style="position: absolute; top: clamp(14px, 1.8vw, 28px); left: clamp(14px, 1.8vw, 28px); width: 12px; height: 12px; border-top: 1px solid rgba(242, 242, 240, 0.3); border-left: 1px solid rgba(242, 242, 240, 0.3); pointer-events: none"></span>
<span aria-hidden="true" style="position: absolute; top: clamp(14px, 1.8vw, 28px); right: clamp(14px, 1.8vw, 28px); width: 12px; height: 12px; border-top: 1px solid #FF2B5E; border-right: 1px solid #FF2B5E; pointer-events: none"></span>
<span aria-hidden="true" style="position: absolute; bottom: clamp(14px, 1.8vw, 28px); left: clamp(14px, 1.8vw, 28px); width: 12px; height: 12px; border-bottom: 1px solid rgba(242, 242, 240, 0.3); border-left: 1px solid rgba(242, 242, 240, 0.3); pointer-events: none"></span>
<span aria-hidden="true" style="position: absolute; bottom: clamp(14px, 1.8vw, 28px); right: clamp(14px, 1.8vw, 28px); width: 12px; height: 12px; border-bottom: 1px solid rgba(242, 242, 240, 0.3); border-right: 1px solid rgba(242, 242, 240, 0.3); pointer-events: none"></span>
<div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: clamp(18px, 2.2vw, 30px); max-width: 100%">
<h1 style="margin: 0 0 0 -0.05em; font-family: 'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-stretch: 125%; font-size: clamp(38px, 12vw, 180px); line-height: 0.9; letter-spacing: -0.035em; color: #F2F2F0">Ludonaut</h1>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="flex: none; width: 28px; height: 2px; background: #FF2B5E; box-shadow: 0 0 10px #FF2B5E99"></span>
<p style="margin: 0; font-size: clamp(12px, 0.9vw, 14px); font-weight: 400; line-height: 1.5; letter-spacing: 0.34em; text-transform: uppercase; color: #9A9CA3">Charting the unplayed</p>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-left: 42px; max-width: 40rem">
<p style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-stretch: 100%; font-size: clamp(14px, 1.05vw, 16px); line-height: 1.55; letter-spacing: 0.01em; color: #A7A9AF; text-wrap: pretty">A platform for AI that sees and plays games.</p>
<p style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-stretch: 100%; font-size: clamp(14px, 1.05vw, 16px); line-height: 1.55; letter-spacing: 0.01em; color: #A7A9AF; text-wrap: pretty">Automate gameplay. Play together with AI.</p>
</div>
<p style="margin: 6px 0 0 0; padding-left: 42px; font-size: clamp(14px, 1.1vw, 17px); font-weight: 500; line-height: 1.4; letter-spacing: 0.06em; color: #FF2B5E; text-shadow: 0 0 14px #FF2B5E99">Not yet.</p>
</div>
</div>
</main>
</body>
</html>
